<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Materiais de Limpeza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/produtos.js"></script>
    <script src="js/movimentacao.js"></script>
    <script src="js/relatorios.js"></script>
    <script src="js/atalhos.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/grafico.js"></script>

    <script>
        // Atualiza o texto do botão "Tema" (se ele estiver na tela)
        function atualizarBotaoTema() {
            const escuro = document.body.classList.contains('modo-escuro');
            const btn = document.getElementById('btnTemaMenu');
            if (btn) {
                btn.textContent = escuro ? '☀️ Tema' : '🌙 Tema';
            }
        }

        function alternarModoEscuro() {
            document.body.classList.toggle('modo-escuro');
            const escuro = document.body.classList.contains('modo-escuro');
            localStorage.setItem('modoEscuro', escuro ? 'ativado' : 'desativado');
            atualizarBotaoTema();
        }

        // Carregar tema salvo ao iniciar
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('modoEscuro') === 'ativado') {
                document.body.classList.add('modo-escuro');
            }
        });

        // Atualiza o ícone do botão sempre que o menu for redesenhado
        new MutationObserver(atualizarBotaoTema)
            .observe(document.getElementById('app'), { childList: true });
    </script>
</body>
</html>
